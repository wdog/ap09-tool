<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>AP-09 Looper</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e5482a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#171a21"/>
    </linearGradient>
  </defs>
  <!-- USB port -->
  <rect x="53" y="2" width="22" height="10" rx="2" fill="#171a21"/>
  <!-- pedal body -->
  <rect x="15" y="8" width="98" height="114" rx="18" fill="url(#body)" stroke="#000" stroke-opacity=".2" stroke-width="2"/>
  <!-- face: loop arrow around a waveform -->
  <rect x="25" y="18" width="78" height="70" rx="12" fill="url(#face)"/>
  <path d="M84.5 58 A21 21 0 1 1 79 38" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <path d="M71 29 L89 32 L81 47 Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#ff8a3d" stroke-width="4" stroke-linecap="round">
    <line x1="52" y1="49" x2="52" y2="57"/>
    <line x1="58" y1="43" x2="58" y2="63"/>
    <line x1="64" y1="47" x2="64" y2="59"/>
    <line x1="70" y1="41" x2="70" y2="65"/>
    <line x1="76" y1="50" x2="76" y2="56"/>
  </g>
  <!-- LED -->
  <circle cx="35" cy="28" r="3.5" fill="#5ef08a"/>
  <!-- footswitch -->
  <circle cx="64" cy="105" r="12" fill="#d5d8de" stroke="#8a8f99" stroke-width="3"/>
  <circle cx="64" cy="105" r="5" fill="#8a8f99"/>
</svg>
